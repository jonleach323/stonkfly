<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sat Rush Fly clip frame</title>
<link rel="stylesheet" href="fonts.css">
<style>
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #060709; }
  #output { position: absolute; inset: 0; width: 1280px; height: 720px; display: block; }
  .mark { position: absolute; left: 44px; top: 40px; font-family: "Space Mono", monospace; font-size: 34px; letter-spacing: 3px; color: #f3f4ed; text-shadow: 2px 2px 0 rgba(0,0,0,0.6); }
  .replay { position: absolute; left: 44px; bottom: 44px; width: 560px; box-sizing: border-box; padding: 12px 18px 12px 16px; background: rgba(14, 16, 21, 0.86); border: 1px solid #32353e; font-family: "Space Mono", monospace; color: #f3f4ed; }
  .replay .head { display: flex; justify-content: space-between; font-size: 16px; letter-spacing: 2px; }
  .replay .head span:first-child::before { content: ""; display: inline-block; width: 3px; height: 14px; background: #7376ff; margin-right: 12px; vertical-align: -1px; }
  .replay .body { display: flex; align-items: flex-start; gap: 22px; margin-top: 10px; }
  .replay canvas { width: 520px; height: 58px; margin-top: 4px; }
  .replay .foot { font-size: 15px; letter-spacing: 2px; color: #989aaa; margin-top: 10px; }
</style>
</head>
<body>
<canvas id="output"></canvas>
<div class="mark">SAT RUSH FLY</div>
<div class="replay">
  <div class="head"><span>NEURAL REPLAY</span><span id="clock">0.00 S</span></div>
  <div class="body">
    <canvas id="raster" width="1040" height="116"></canvas>
  </div>
  <div class="foot" id="foot">166700 NEURONS</div>
</div>
<script src="demo-data.js"></script>
<script type="module">
  import { startScene } from './scene.js';
  const demo = window.__STONKFLY_DEMO;
  const canvas = document.getElementById('output');
  const scene = startScene(canvas, { internalWidth: 1280 });
  const state = demo.state;
  // The observation's own round, kept open for the whole clip so the presses run to the end.
  const board = { ...(state.board || {}), ends_at: Number(demo.captured_at) + 58, fetched_at: Number(demo.captured_at), live: false };
  await (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve());
  scene.update(state, board, 0);
  window.__scene = scene;

  // The replay panel. The raster is the 21
  // tile groups' firing rates as tick rows (three ticks per Hz), swept by a
  // playhead; it is a rate picture, not recorded spike times.
  const neural = state.neural || {};
  const groups = Array.isArray(neural.group_hz) ? neural.group_hz : [];
  document.getElementById('foot').textContent = `166700 NEURONS · ${groups.length}-GROUP RATE RASTER`;
  const mulberry = (a) => () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const rows = groups.map((hz, i) => { const r = mulberry(1000 + i); return Array.from({ length: Math.min(140, Math.round(hz * 3)) }, () => r()).sort(); });
  const raster = document.getElementById('raster');
  const rc = raster.getContext('2d');
  const PERIOD = 8; // seconds per sweep
  window.__overlay = (t) => {
    document.getElementById('clock').textContent = `${t.toFixed(2)} S`;
    const W = raster.width, H = raster.height, rowH = H / Math.max(1, rows.length);
    const head = (t % PERIOD) / PERIOD;
    rc.clearRect(0, 0, W, H);
    rc.fillStyle = '#7376ff';
    rc.fillRect(0, 0, Math.round(W * head), 4);
    rows.forEach((ticks, i) => {
      const y = 8 + i * ((H - 8) / rows.length);
      ticks.forEach((x) => {
        rc.fillStyle = x <= head ? '#f3f4ed' : '#3a3d48';
        rc.fillRect(Math.round(x * W), Math.round(y), 3, Math.max(2, Math.round(rowH) - 1));
      });
    });
    rc.fillStyle = '#7376ff';
    rc.fillRect(Math.round(W * head), 0, 2, H);
  };
  window.__overlay(0);
  window.__ready = true;
</script>
</body>
</html>
