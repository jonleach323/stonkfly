# nginx server block for a server that already fronts other subdomains (Cloudflare proxied DNS
# pointing at this host). Put it next to your other sites and reload nginx.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fly.example.com;
    # Reuse your existing certificate (an origin certificate from Cloudflare, or certbot).
    ssl_certificate     /etc/ssl/your-cert.pem;
    ssl_certificate_key /etc/ssl/your-key.pem;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
